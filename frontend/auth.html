<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đăng nhập / Đăng ký - ShopVN</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 450px;
      width: 100%;
      padding: 40px;
    }
    .auth-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .auth-header .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 10px;
    }
    .auth-header .logo i {
      font-size: 36px;
    }
    .auth-header p {
      color: var(--text-light);
      font-size: 14px;
    }
    .auth-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 2px solid var(--border);
    }
    .auth-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: -2px;
    }
    .auth-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .auth-form {
      display: none;
    }
    .auth-form.active {
      display: block;
      animation: fadeIn 0.3s ease;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text);
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 14px;
      transition: all 0.2s;
    }
    .form-group input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(238, 77, 45, 0.1);
    }
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-submit:hover {
      background: var(--primary-dark);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.3);
    }
    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      background: white;
      padding: 0 12px;
      color: var(--text-lighter);
      position: relative;
      font-size: 14px;
    }
    .back-home {
      text-align: center;
      margin-top: 20px;
    }
    .back-home a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .back-home a:hover {
      text-decoration: underline;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">
        <i class="fas fa-shopping-bag"></i>
        <span>ShopVN</span>
      </div>
      <p>Mua sắm online giá tốt, giao hàng nhanh chóng</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" data-tab="login">Đăng Nhập</button>
      <button class="auth-tab" data-tab="signup">Đăng Ký</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="auth-form active">
      <div class="form-group">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Mật khẩu</label>
        <input type="password" id="loginPassword" placeholder="Nhập mật khẩu" required />
      </div>
      <button type="submit" class="btn-submit">
        <i class="fas fa-sign-in-alt"></i> Đăng Nhập
      </button>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="auth-form">
      <div class="form-group">
        <label for="signupName">Họ và tên</label>
        <input type="text" id="signupName" placeholder="Nguyễn Văn A" required />
      </div>
      <div class="form-group">
        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" placeholder="email@example.com" required />
      </div>
      <div class="form-group">
        <label for="signupPhone">Số điện thoại</label>
        <input type="tel" id="signupPhone" placeholder="0912345678" required />
      </div>
      <div class="form-group">
        <label for="signupRole">Loại tài khoản</label>
        <select id="signupRole" style="width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px;">
          <option value="buyer">👤 Người mua hàng</option>
          <option value="seller">🏪 Người bán hàng</option>
        </select>
      </div>
      <div class="form-group">
        <label for="signupPassword">Mật khẩu</label>
        <input type="password" id="signupPassword" placeholder="Nhập mật khẩu" required />
      </div>
      <div class="form-group">
        <label for="signupConfirmPassword">Xác nhận mật khẩu</label>
        <input type="password" id="signupConfirmPassword" placeholder="Nhập lại mật khẩu" required />
      </div>
      <button type="submit" class="btn-submit">
        <i class="fas fa-user-plus"></i> Đăng Ký
      </button>
    </form>

    <div class="divider">
      <span>hoặc</span>
    </div>

    <div class="back-home">
      <a href="index.html">
        <i class="fas fa-arrow-left"></i>
        Quay về trang chủ
      </a>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // Tab switching
    document.querySelectorAll('.auth-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const targetTab = tab.getAttribute('data-tab');
        
        document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
        
        tab.classList.add('active');
        document.getElementById(targetTab + 'Form').classList.add('active');
      });
    });

    // Check URL params for tab
    const urlParams = new URLSearchParams(window.location.search);
    const tab = urlParams.get('tab');
    if (tab === 'signup') {
      document.querySelector('[data-tab="signup"]').click();
    }
  </script>
</body>
</html>
